<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="projectstyles.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EchoRepose</title>
  <link rel="icon" type="image/png" href="Resources/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      color: #f4f4f4;
      margin: 0;
      padding: 40px;
      background: #131212;

      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;

      animation: fadeIn 0.7s ease;
    }

    a {
      color: #89a4af;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background: #1a1a1a;
      padding: 30px;
      border-radius: 10px;

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    img {
      max-width: 100%;
      border-radius: 6px;
      margin: 20px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    section {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .image-with-border {
      width: 45%;
      height: auto;
      object-fit: contain;
    }

    .small-image {
      width: 25%;
      height: auto;
    }
.carousel {
    position: relative;
    width: min(90vw, 700px);

    display: flex;
    justify-content: center;
    align-items: center;

    margin: 20px auto;
}

.carousel img {
    width: 100%;
    max-height: 100vh;
    height: 40vh;
    object-fit: contain;

    border-radius: 8px;
    transition: opacity .25s ease;
}

.carousel-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 50px;
  height: 50px;

  border: none;
  border-radius: 50%;
  background: rgba(20,20,20,0.75);
  color: white;

  font-size: 28px;
  cursor: pointer;

  transition: background .2s;
  user-select: none;
}

.carousel-btn:hover {
  background: rgba(40,40,40,0.95);
}

.prev {
  left: -70px;
}

.next {
  right: -70px;
}

@media (max-width: 800px) {

  .prev {
    left: 5px;
  }

  .next {
    right: 5px;
  }

  .carousel-btn {
    width: 40px;
    height: 40px;
    font-size: 22px;
  }

}
  </style>
</head>
<body>
  <div class="container">
    <img src="Resources/logo5.png" alt="EchoReposeLogo" style="width: 40%; margin: 0 auto; display: block; ">
    <p>EchoRepose is a work in progress abstract puzzle game with unique and challenging mechanics. </p> <br>
          <a href="https://docs.google.com/document/d/1NbLdZlW7HMZdGULPzXknJ5EF1vpQy0CTbtsgrvj5x8s/edit?usp=sharing" class="btn-border-to-line-text btn-border-to-line-text--gray">
        <svg width="100%" height="100%">
          <rect x="0" y="0" fill="none" width="100%" height="100%" />
        </svg>
        GDD
      </a>
    <div class="carousel">

        <button class="carousel-btn prev">&#10094;</button>

        <img id="carouselImage"
            src="Resources/echorepose.png"
            alt="EchoRepose Screenshot">

        <button class="carousel-btn next">&#10095;</button>

    </div>
    <p><a href="/">Back to Main</a></p>
  </div>
</body>
<script>

const images = [
    "Resources/echorepose.png",
    "Resources/echorepose2.png",
    "Resources/echorepose4.png",
    "Resources/echorepose5.png"
];

let currentImage = 0;

const image = document.getElementById("carouselImage");

function showImage(index){

    image.style.opacity = 0;

    setTimeout(() => {
        image.src = images[index];
        image.style.opacity = 1;
    }, 150);

}

document.querySelector(".next").addEventListener("click", () => {

    currentImage++;

    if(currentImage >= images.length)
        currentImage = 0;

    showImage(currentImage);

});

document.querySelector(".prev").addEventListener("click", () => {

    currentImage--;

    if(currentImage < 0)
        currentImage = images.length - 1;

    showImage(currentImage);

});

// Keyboard support
document.addEventListener("keydown", (e)=>{

    if(e.key === "ArrowRight")
        document.querySelector(".next").click();

    if(e.key === "ArrowLeft")
        document.querySelector(".prev").click();

});

</script>
</html>
